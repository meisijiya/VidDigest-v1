# VidDigest 线上实例（nginx 站点配置）
#
# 装法（在服务器上）：
#   sudo cp deploy/nginx/viddigest-8443.conf /etc/nginx/sites-available/viddigest-8443.conf
#   sudo ln -sf /etc/nginx/sites-available/viddigest-8443.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 回滚：删掉 sites-enabled 里的软链 + reload（应用容器可留着，不占公网端口）。
#
# 拓扑（应用全部绑回环，不新增公网端口）：
#   浏览器 → nginx:8443
#            ├─ /       → 127.0.0.1:8080  frontend 容器（nginx:alpine，SPA 静态文件）
#            └─ /api/   → 127.0.0.1:8000  backend 容器（uvicorn）
#
# 为什么用 8443 而不是主站的 443：
#   443 已经被同一台机器上的另一个站点（主域名）占着，同一个 server_name
#   不能再起第二个 443 server 块。而**子域**这条路走不通：腾讯云对未备案
#   域名的 HTTP 请求会 302 到 dnspod 的拦截页（certbot 验证子域时被拦：
#   Invalid response from https://dnspod.qcloud.com/static/webblock.html），
#   主域名在备案白名单里，所以复用主域名 + 另一个端口是最省事且不被拦的路。
#   要迁到子域（vid.<主域名>），先在 DNSPod 加 A 记录，再把本文件的
#   listen 8443 改成 listen 443 ssl + server_name <子域>，
#   并用 certbot --webroot 签该子域的证书。
#
# 为什么 /api/ **直连 backend 容器**，不转给 frontend 容器：
#   仓库的 frontend/nginx.conf 里 `proxy_set_header X-Forwarded-For $remote_addr;`
#   是**覆盖**语义（ADR 0022）。若把宿主 nginx 放在最外层再转给 frontend 容器，
#   容器看到的 $remote_addr 永远是 docker 网关 → 所有用户落进同一个限流桶，
#   互相误伤 429。宿主 nginx 直接把 /api/ 转给 backend，backend 取 XFF 末段
#   才是真实客户端 IP。
#
# SSE（/api/summarize、/api/chat）：必须 proxy_buffering off，否则事件要等
# 缓冲区满了才吐给客户端。
#
# 证书：复用主域名的证书（certbot 自动续期）。证书上只有主域名，所以
# server_name 必须是主域名。

server {
    listen 8443 ssl http2;
    server_name ljhlovefjm.top;

    ssl_certificate /etc/letsencrypt/live/ljhlovefjm.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ljhlovefjm.top/privkey.pem;

    # 下载产物走后端，体积不大；但留出余量，别让大文件被默认限制掐掉。
    client_max_body_size 64m;

    # API：直连 backend 容器（理由见文件头）。
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 覆盖语义（不是追加）：backend 取末段，末段要是真实客户端 IP。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE：缓冲必须关。
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 其余交给 SPA 容器（静态文件 + 它自己的 rewrite）。
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}
